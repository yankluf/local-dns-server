<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LDS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f7c6e'/%3E%3Cpath d='M9 9v14h5M18 9h3a5 5 0 0 1 0 10h-3z' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef2f4;
  --surface: #ffffff;
  --ink: #17232e;
  --muted: #5d6b78;
  --faint: #95a2ad;
  --line: #d6dee4;
  --wild: #9a5b00;  --wild-bg: #fbefd9;
  --host: #0f7c6e;  --host-bg: #dcf3ee;
  --alias: #6447b8; --alias-bg: #ebe5fb;
  --danger: #b4232a;
  --focus: #2b6cdf;
  --sans: "Atkinson Hyperlegible", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12191f; --surface: #1a232b; --ink: #e5ecf1; --muted: #9aa8b4; --faint: #64727e; --line: #2b3741;
    --wild: #f0b252; --wild-bg: #3a2a10; --host: #4fd1b9; --host-bg: #0f3330; --alias: #b29cf5; --alias-bg: #2c2350;
    --danger: #ff7b7b; --focus: #7aa7ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12191f; --surface: #1a232b; --ink: #e5ecf1; --muted: #9aa8b4; --faint: #64727e; --line: #2b3741;
  --wild: #f0b252; --wild-bg: #3a2a10; --host: #4fd1b9; --host-bg: #0f3330; --alias: #b29cf5; --alias-bg: #2c2350;
  --danger: #ff7b7b; --focus: #7aa7ff; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); }
main { max-width: 1040px; margin: 0 auto; padding: 32px 16px 64px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px 24px; margin-bottom: 28px; }
h1 { font: 600 1.75rem/1 var(--mono); letter-spacing: -0.02em; margin: 0; }
h1 span { font: 400 1rem var(--sans); letter-spacing: 0; color: var(--muted); margin-left: 8px; }
.status { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .875rem; color: var(--muted); margin: 0; padding: 0; list-style: none; }
.status li::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--faint); margin-right: 7px; vertical-align: 1px; }
.status li.ok::before { background: var(--host); }
.status li.bad::before { background: var(--danger); }

form.add { display: grid; grid-template-columns: 1.3fr 1fr 1fr auto; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
input { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; min-width: 0; width: 100%; }
input.mono { font-family: var(--mono); font-size: .9375rem; }
button { font: inherit; font-weight: 700; cursor: pointer; border-radius: 6px; border: 1px solid transparent; padding: 9px 16px; }
button.primary { background: var(--ink); color: var(--bg); }
.hint { font-size: .875rem; color: var(--muted); margin: 8px 2px 0; min-height: 1.3em; }
.hint.error { color: var(--danger); }
.hint b { font-family: var(--mono); font-weight: 600; }

.tools { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin: 32px 0 8px; }
.tools input { max-width: 320px; background: var(--surface); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { font-weight: 400; font-size: .875rem; padding: 5px 12px; background: transparent; border-color: var(--line); color: var(--muted); }
.filters button[aria-pressed="true"] { background: var(--surface); color: var(--ink); border-color: var(--ink); }
.count { margin-left: auto; font-size: .875rem; color: var(--muted); }

section.zone { margin-top: 28px; }
.zone h2 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; font: 600 1.125rem var(--mono); margin: 0 0 8px; }
table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
td { padding: 10px 14px; border-top: 1px solid var(--line); vertical-align: top; }
tr:first-child td { border-top: 0; }
td.name { font-family: var(--mono); text-align: right; white-space: nowrap; width: 34%; }
td.name a { color: inherit; text-decoration: none; }
td.name a:hover .sub { text-decoration: underline; }
.sub { font-weight: 600; }
.suffix { color: var(--faint); }
td.arrow { width: 1%; color: var(--faint); padding-left: 0; padding-right: 0; }
td.value { font-family: var(--mono); word-break: break-all; }
.type { display: inline-block; font: 600 .75rem/1 var(--mono); padding: 4px 7px; border-radius: 4px; margin-right: 10px; vertical-align: 2px; }
.t-WILDCARD { color: var(--wild); background: var(--wild-bg); }
.t-A, .t-AAAA { color: var(--host); background: var(--host-bg); }
.t-CNAME { color: var(--alias); background: var(--alias-bg); }
.meta { display: block; font: .8125rem var(--sans); color: var(--muted); margin-top: 3px; word-break: normal; }
.warn { display: block; font: .8125rem var(--sans); color: var(--danger); margin-top: 3px; word-break: normal; }
tr.inactive td.name, tr.inactive td.value > span:first-of-type { opacity: .45; text-decoration: line-through; }
td.act { width: 1%; text-align: right; white-space: nowrap; }
td.act button { font-weight: 400; font-size: .875rem; padding: 4px 10px; background: transparent; color: var(--muted); border-color: var(--line); }
td.act button:hover { color: var(--danger); border-color: var(--danger); }
.lock { font-size: .8125rem; color: var(--faint); }

.empty { margin-top: 40px; padding: 32px; text-align: center; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); }
.empty code { font-family: var(--mono); color: var(--ink); }

@media (max-width: 720px) {
  form.add { grid-template-columns: 1fr 1fr; }
  form.add .c-comment { grid-column: 1 / -1; order: 3; }
  form.add button { grid-column: 1 / -1; order: 4; }
  td.name { text-align: left; white-space: normal; word-break: break-all; width: auto; }
  tr { display: grid; grid-template-columns: 1fr auto; }
  td { border-top: 0; padding: 4px 12px; }
  td.name { grid-column: 1; padding-top: 12px; }
  td.act { grid-column: 2; grid-row: 1; padding-top: 10px; }
  td.arrow { display: none; }
  td.value { grid-column: 1 / -1; padding-bottom: 12px; }
  tr + tr { border-top: 1px solid var(--line); }
  .count { margin-left: 0; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>LDS <span>Local DNS Server</span></h1>
    <ul class="status" id="status" aria-live="polite"><li>Connecting…</li></ul>
  </header>

  <form class="add" id="add" autocomplete="off">
    <input class="mono" name="name" placeholder="grafana.home.lan or *.home.lan" aria-label="Name" required>
    <input class="mono" name="value" placeholder="192.168.1.5 or traefik.home.lan" aria-label="Points to" required>
    <input class="c-comment" name="comment" placeholder="Comment (optional)" aria-label="Comment">
    <button class="primary" type="submit">Add record</button>
  </form>
  <p class="hint" id="hint">An IP makes an A record, a hostname makes a CNAME, and a name starting with <b>*.</b> covers a whole domain.</p>

  <div class="tools">
    <input type="search" id="q" placeholder="Filter by name, IP or container" aria-label="Filter records">
    <div class="filters" role="group" aria-label="Record source">
      <button type="button" data-src="" aria-pressed="true">All</button>
      <button type="button" data-src="manual" aria-pressed="false">Manual</button>
      <button type="button" data-src="docker" aria-pressed="false">Docker</button>
    </div>
    <span class="count" id="count"></span>
  </div>

  <div id="records"></div>
</main>

<script>
const $ = (s) => document.querySelector(s);
let records = [], source = "", authRequired = false;

function token() { try { return localStorage.getItem("lds-token") || ""; } catch { return ""; } }
function setToken(t) { try { localStorage.setItem("lds-token", t); } catch {} }

async function api(method, path, body, retried) {
  const headers = {};
  if (body) headers["Content-Type"] = "application/json";
  if (token()) headers["Authorization"] = "Bearer " + token();
  const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  if (res.status === 401 && !retried) {
    const t = prompt("This server needs its access token (LDS_TOKEN) to change records:");
    if (t) { setToken(t.trim()); return api(method, path, body, true); }
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) n.append(k);
  return n;
}

function ago(iso) {
  if (!iso || iso.startsWith("0001")) return "never";
  const s = Math.round((Date.now() - new Date(iso)) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago";
  return new Date(iso).toLocaleDateString();
}

// Group records under the zone they belong to: the longest wildcard domain
// that covers them, otherwise their parent domain.
function zoneOf(name, zones) {
  const bare = name.replace(/^\*\./, "");
  let best = "";
  for (const z of zones) if ((bare === z || bare.endsWith("." + z)) && z.length > best.length) best = z;
  if (best) return best;
  const parts = bare.split(".");
  return parts.length > 1 ? parts.slice(1).join(".") : bare;
}

function render() {
  const q = $("#q").value.trim().toLowerCase();
  const shown = records.filter((r) =>
    (!source || r.source === source) &&
    (!q || [r.name, r.value, r.container, r.comment].some((f) => f && f.toLowerCase().includes(q))));

  const zones = records.filter((r) => r.type === "WILDCARD").map((r) => r.name.slice(2));
  const groups = new Map();
  for (const r of shown) {
    const z = zoneOf(r.name, zones);
    if (!groups.has(z)) groups.set(z, []);
    groups.get(z).push(r);
  }

  $("#count").textContent = shown.length === records.length
    ? `${records.length} record${records.length === 1 ? "" : "s"}`
    : `${shown.length} of ${records.length} records`;

  const root = $("#records");
  root.replaceChildren();
  if (!records.length) {
    root.append(el("div", { class: "empty" },
      el("p", {}, "No records yet. Add one above, or from the command line:"),
      el("p", {}, el("code", {}, "lds add '*.home.lan' 192.168.1.5"))));
    return;
  }
  if (!shown.length) {
    root.append(el("div", { class: "empty" }, "No records match this filter."));
    return;
  }

  for (const [zone, recs] of [...groups].sort((a, b) => a[0].localeCompare(b[0]))) {
    const wild = recs.find((r) => r.type === "WILDCARD" && r.name === "*." + zone);
    const rows = recs.filter((r) => r !== wild);
    const head = el("h2", {}, zone);
    const tbody = el("tbody");
    if (wild) tbody.append(row(wild, zone));
    for (const r of rows) tbody.append(row(r, zone));
    root.append(el("section", { class: "zone" }, head, el("table", {}, tbody)));
  }
}

function row(r, zone) {
  const isWild = r.type === "WILDCARD";
  const sub = r.name === zone ? "" : r.name.slice(0, r.name.length - zone.length - 1);
  const suffix = sub ? "." + zone : zone;
  const nameNode = isWild || r.name.includes("*")
    ? el("span", {}, el("span", { class: "sub" }, sub), el("span", { class: "suffix" }, suffix))
    : el("a", { href: "https://" + r.name, target: "_blank", rel: "noopener", title: "Open https://" + r.name },
        el("span", { class: "sub" }, sub), el("span", { class: "suffix" }, suffix));

  const meta = [];
  if (isWild) meta.push(`every other name in ${zone}`);
  meta.push(r.source === "docker" ? `from container ${r.container}` : `added ${ago(r.created_at)}`);
  if (r.comment) meta.push(r.comment);

  const act = r.source === "manual"
    ? el("button", { type: "button", "aria-label": "Remove " + r.name, onclick: () => remove(r) }, "Remove")
    : el("span", { class: "lock", title: "Managed by Docker labels" }, "auto");

  return el("tr", { class: r.active ? "" : "inactive" },
    el("td", { class: "name" }, nameNode),
    el("td", { class: "arrow", "aria-hidden": "true" }, "→"),
    el("td", { class: "value" },
      el("span", { class: "type t-" + r.type }, isWild ? "*" : r.type),
      el("span", {}, r.value),
      el("span", { class: "meta" }, meta.join(" — ")),
      r.warning && el("span", { class: "warn" }, r.warning)),
    el("td", { class: "act" }, act));
}

async function remove(r) {
  if (!confirm(`Remove ${r.name} → ${r.value}?`)) return;
  try { await api("DELETE", "/api/records/" + encodeURIComponent(r.id)); hint(`Removed ${r.name}.`); }
  catch (e) { hint(e.message, true); }
  load();
}

function hint(msg, error) { const h = $("#hint"); h.textContent = msg; h.classList.toggle("error", !!error); }

async function load() {
  try {
    const [list, status] = await Promise.all([api("GET", "/api/records"), api("GET", "/api/status")]);
    records = list.records || [];
    authRequired = status.auth_required;
    renderStatus(status);
    render();
  } catch (e) {
    $("#status").replaceChildren(el("li", { class: "bad" }, "Can't reach the LDS server"));
  }
}

function renderStatus(s) {
  const items = [];
  const d = s.dnsmasq;
  if (d && d.enabled) items.push(el("li", { class: d.running ? "ok" : "bad", title: d.last_error || "" },
    d.running ? `dnsmasq running, reloaded ${ago(d.last_reload)}` : `dnsmasq stopped${d.last_error ? ": " + d.last_error : ""}`));
  else items.push(el("li", {}, "dnsmasq not managed"));
  const k = s.docker;
  if (k && k.enabled) items.push(el("li", { class: k.connected ? "ok" : "bad", title: k.last_error || "" },
    k.connected ? `Docker synced ${ago(k.last_sync)}` : "Docker unreachable"));
  if (s.upstreams && s.upstreams.length) items.push(el("li", { class: "ok" }, "Forwarding to " + s.upstreams.join(", ")));
  $("#status").replaceChildren(...items);
}

$("#add").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target, v = (k) => f.elements[k].value;
  try {
    const r = await api("POST", "/api/records", { name: v("name"), value: v("value"), comment: v("comment") });
    hint(r.warning ? `Added ${r.name}, but: ${r.warning}` : `Added ${r.name} → ${r.value}.`, !!r.warning);
    f.reset(); f.elements.name.focus();
  } catch (err) { hint(err.message, true); }
  load();
});
$("#q").addEventListener("input", render);
document.querySelectorAll(".filters button").forEach((b) => b.addEventListener("click", () => {
  source = b.dataset.src;
  document.querySelectorAll(".filters button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  render();
}));
load();
setInterval(load, 10000);
</script>
</body>
</html>
