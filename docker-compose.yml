services:
  lds:
    build: .
    image: lds:latest
    container_name: lds
    restart: unless-stopped
    # Host networking puts dnsmasq on port 53 of this machine and lets it see
    # real client IPs. Free port 53 first (stop Pi-hole, and systemd-resolved's
    # stub listener if your distro runs it).
    network_mode: host
    depends_on: [docker-proxy]

    # Hardening: read-only filesystem, no privilege escalation, and only the
    # capabilities dnsmasq needs (bind port 53, then switch to its own user).
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID]

    # Everything below is optional: LDS starts with no settings at all. See
    # "Basic configuration" in the README for what each one unlocks. Most can
    # also be changed later on the dashboard's Settings page.
    environment:
      # Reach Docker through the read-only proxy below, never the raw socket.
      DOCKER_HOST: tcp://127.0.0.1:2375
      # The domains LDS answers for (or set them under Settings).
      # LDS_ZONES: home.lan
      # IP of the machine running Traefik; turns on Docker discovery (or set it under Settings).
      # LDS_DOCKER_TARGET: 192.168.1.5
      # Web page and API. Tip: use this machine's LAN IP, e.g. 192.168.1.5:5380.
      # LDS_HTTP_LISTEN: ":5380"
      # Your own token. Without one, LDS generates one in ./data/admin-token.
      # LDS_TOKEN_FILE: /run/secrets/lds_token
    # secrets: [lds_token]
    volumes:
      - ./data:/data
      # Optional: your own dnsmasq settings (*.conf).
      - ./dnsmasq.d:/etc/dnsmasq.d:ro

  # Mounting docker.sock straight into LDS would hand it full control of
  # Docker (":ro" doesn't limit the API). This proxy only allows reading the
  # container list and events, and only listens on this machine.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.1@sha256:3400c429c5f9e1b21d62130fb93b16e2e772d4fb7695bd52fc2b743800b9fe9e
    container_name: lds-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      EVENTS: 1
      POST: 0
    ports:
      - "127.0.0.1:2375:2375"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs: [/run]
    security_opt: ["no-new-privileges:true"]

# To use your own token instead of the generated one, create it with
#   openssl rand -hex 32 > lds_token.txt && chmod 600 lds_token.txt
# then uncomment LDS_TOKEN_FILE and "secrets" above, and this block:
# secrets:
#   lds_token:
#     file: ./lds_token.txt
